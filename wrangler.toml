
name = "private-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-07"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "private-proxy-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ACCESS_TEAM_DOMAIN = "YOUR_TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_ACCESS_APPLICATION_AUD"
